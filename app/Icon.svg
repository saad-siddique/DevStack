<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- DevStack icon: three stacked layers (the stack) on a deep sea gradient, one lit LED. Single source for the
       app icon (Tools/MakeIcon.swift renders every size) and the dashboard favicon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23456F"/>
      <stop offset="0.5" stop-color="#0F6473"/>
      <stop offset="1" stop-color="#08243D"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDEAF3"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9C6D8"/>
      <stop offset="1" stop-color="#6E92A9"/>
    </linearGradient>
    <radialGradient id="led" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#B9FFD4"/>
      <stop offset="0.45" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#16A34A"/>
    </radialGradient>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#bg)"/>
  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#sheen)"/>

  <!-- Bottom layer -->
  <g transform="translate(512 648)" opacity="0.46">
    <path d="M-236 0 L0 118 L236 0 L236 40 L0 158 L-236 40 Z" fill="#061A2C" opacity="0.45" transform="translate(0 22)"/>
    <path d="M-236 0 L0 118 L236 0 L236 40 L0 158 L-236 40 Z" fill="url(#side)" stroke="#88A9BE" stroke-width="20" stroke-linejoin="round"/>
    <path d="M0 -118 L236 0 L0 118 L-236 0 Z" fill="url(#face)" stroke="#EEF5FA" stroke-width="20" stroke-linejoin="round"/>
  </g>
  <!-- Middle layer -->
  <g transform="translate(512 528)" opacity="0.72">
    <path d="M-236 0 L0 118 L236 0 L236 40 L0 158 L-236 40 Z" fill="#061A2C" opacity="0.45" transform="translate(0 22)"/>
    <path d="M-236 0 L0 118 L236 0 L236 40 L0 158 L-236 40 Z" fill="url(#side)" stroke="#88A9BE" stroke-width="20" stroke-linejoin="round"/>
    <path d="M0 -118 L236 0 L0 118 L-236 0 Z" fill="url(#face)" stroke="#EEF5FA" stroke-width="20" stroke-linejoin="round"/>
  </g>
  <!-- Top layer -->
  <g transform="translate(512 408)">
    <path d="M-236 0 L0 118 L236 0 L236 40 L0 158 L-236 40 Z" fill="#061A2C" opacity="0.5" transform="translate(0 22)"/>
    <path d="M-236 0 L0 118 L236 0 L236 40 L0 158 L-236 40 Z" fill="url(#side)" stroke="#88A9BE" stroke-width="20" stroke-linejoin="round"/>
    <path d="M0 -118 L236 0 L0 118 L-236 0 Z" fill="url(#face)" stroke="#F4F9FC" stroke-width="20" stroke-linejoin="round"/>
    <!-- LED with glow -->
    <ellipse cx="0" cy="4" rx="64" ry="42" fill="#3DDC84" opacity="0.28"/>
    <ellipse cx="0" cy="2" rx="40" ry="26" fill="url(#led)"/>
    <ellipse cx="-10" cy="-6" rx="14" ry="8" fill="#FFFFFF" opacity="0.55"/>
  </g>
</svg>
