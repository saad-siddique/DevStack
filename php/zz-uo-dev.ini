; local-devstack: dev parity with MAMP PRO + no stale-file surprises.
; Installed by bootstrap.sh into /opt/homebrew/etc/php/<version>/conf.d/zz-uo-dev.ini
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
upload_max_filesize = 1G
post_max_size = 1G
display_errors = On
error_reporting = E_ALL
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
sendmail_path = "/opt/homebrew/bin/mailpit sendmail"
