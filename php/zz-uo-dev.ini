; DevStack: dev parity with MAMP PRO + no stale-file surprises.
; Installed by bootstrap.sh into $(brew --prefix)/etc/php/<version>/conf.d/zz-uo-dev.ini (__BREW_PREFIX__ is filled in)
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
upload_max_filesize = 1G
post_max_size = 1G
display_errors = On
error_reporting = E_ALL
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; PHP caches resolved paths per worker for 120 s by default, so a symlink re-pointed with `ln -sfn` (a plugin checkout
; switched between branches) keeps serving the old target from some of the 20 workers. 1 s is cheap on a local disk.
; Never 0: that means "never expire".
realpath_cache_ttl = 1
sendmail_path = "__BREW_PREFIX__/bin/mailpit sendmail"

; Xdebug (the extension itself is toggled by bin/php-xdebug; these are inert while it is off)
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = 127.0.0.1
xdebug.client_port = 9003
xdebug.log_level = 0
