; DevStack php-fpm pool drop-in, copied by bootstrap into /opt/homebrew/etc/php/<v>/php-fpm.d/. php-fpm merges a
; second [valet] section over Valet's valet-fpm.conf, so this survives `valet use` / `valet install` regenerating it.
; Guards: enough workers for wp-admin's parallel requests (Valet ships 5), recycle workers before leaks pile up,
; kill a request stuck past PHP's own 300 s limit, and log anything slower than 15 s with a stack trace.
[valet]
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 300s
request_slowlog_timeout = 15s
slowlog = __VALET_HOME__/Log/php-fpm-slow.log
